services:
  - type: web
    name: nexora-isp-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /admin/login/
    disk:
      name: nexora-media
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DB_NAME
        fromDatabase:
          name: nexora-isp-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: nexora-isp-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: nexora-isp-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: nexora-isp-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: nexora-isp-db
          property: port
      - key: ALLOWED_HOSTS
        value: ""
      - key: CORS_ALLOWED_ORIGINS
        value: "https://nexora-isp.vercel.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://nexora-isp.vercel.app"
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: CSRF_COOKIE_SECURE
        value: "true"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: MEDIA_ROOT
        value: "/var/data/media"

databases:
  - name: nexora-isp-db
    plan: basic-256mb
    region: singapore
