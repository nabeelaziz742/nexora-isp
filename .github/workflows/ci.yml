name: Nexora CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nexora_test
          POSTGRES_USER: nexora
          POSTGRES_PASSWORD: nexora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexora -d nexora_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Check migrations
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key
          DJANGO_DEBUG: "False"
          ALLOWED_HOSTS: 127.0.0.1,localhost
          DB_NAME: nexora_test
          DB_USER: nexora
          DB_PASSWORD: nexora
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
        run: python manage.py makemigrations --check --dry-run

      - name: Run backend tests
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key
          DJANGO_DEBUG: "False"
          ALLOWED_HOSTS: 127.0.0.1,localhost
          DB_NAME: nexora_test
          DB_USER: nexora
          DB_PASSWORD: nexora
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          CORS_ALLOWED_ORIGINS: http://localhost:3000
        run: python manage.py test --verbosity 2

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: nexora-isp/package-lock.json

      - name: Install frontend dependencies
        working-directory: nexora-isp
        run: npm ci

      - name: Lint frontend
        working-directory: nexora-isp
        run: npm run lint

      - name: Build frontend
        working-directory: nexora-isp
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000/api/v1
        run: npm run build
